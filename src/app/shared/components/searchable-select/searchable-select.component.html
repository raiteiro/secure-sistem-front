<div
  #trigger
  class="ss-trigger"
  tabindex="0"
  role="combobox"
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  [class.disabled]="disabled"
  [class.open]="open()"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
>
  <span class="ss-value" [class.placeholder]="!selectedLabel">{{ selectedLabel || placeholder }}</span>
  <i class="pi pi-chevron-down ss-arrow"></i>
</div>

@if (open()) {
  <div #panel class="ss-panel" role="listbox" (keydown)="onKeydown($event)">
    <div class="ss-search">
      <i class="pi pi-search"></i>
      <input
        type="text"
        [ngModel]="search()"
        (ngModelChange)="onSearchChange($event)"
        [placeholder]="searchPlaceholder"
        autocomplete="off"
      />
    </div>
    <div class="ss-options">
      @if (filteredOptions.length === 0) {
        <div class="ss-empty">{{ emptyLabel }}</div>
      } @else {
        @for (option of filteredOptions; track option.value; let i = $index) {
          <div
            class="ss-option"
            role="option"
            [class.active]="i === activeIndex()"
            [class.selected]="option.value === value"
            [class.disabled]="option.disabled"
            [attr.aria-selected]="option.value === value"
            (mouseenter)="activeIndex.set(i)"
            (click)="selectOption(option)"
          >
            {{ option.label }}
          </div>
        }
      }
    </div>
  </div>
}
